name: Katabump Auto Renew

on:
  schedule:
    # 每天 UTC 0点 (北京时间 8点) 运行
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  renew:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          npm install
          npx playwright install-deps chrome

      - name: Test Telegram
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          set -e

          if [ -z "$TG_BOT_TOKEN" ]; then
            echo "TG_BOT_TOKEN is empty"
            exit 1
          fi

          if [ -z "$TG_CHAT_ID" ]; then
            echo "TG_CHAT_ID is empty"
            exit 1
          fi

          curl -sS -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" \
            --data-urlencode text="Katabump GitHub Actions Telegram test" \
            -o /tmp/tg_response.json

          python3 - <<'PY'
          import json
          import sys

          with open("/tmp/tg_response.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          if data.get("ok"):
              print("Telegram test sent OK")
          else:
              print("Telegram test failed:")
              print(data.get("description", data))
              sys.exit(1)
          PY

      - name: Run Renew Script
        env:
          # 将 USERS_JSON 配置在 GitHub Repository Secrets 中
          # 格式: [{"username": "xxx", "password": "xxx"}, ...]
          USERS_JSON: ${{ secrets.USERS_JSON }}
          HTTP_PROXY: ${{ secrets.HTTP_PROXY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        # 使用 xvfb-run 模拟有头环境运行
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" node action_renew.js

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
